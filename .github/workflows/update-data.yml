name: Update WeatherXM data

on:
  schedule:
    # Runs at minute 0 of every hour (UTC time)
    - cron: '0 * * * *'
  workflow_dispatch: {}  # lets you also trigger it manually from GitHub's website

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch latest WeatherXM data
        env:
          WEATHERXM_EMAIL: ${{ secrets.WEATHERXM_EMAIL }}
          WEATHERXM_PASSWORD: ${{ secrets.WEATHERXM_PASSWORD }}
        run: python fetch_weatherxm_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weatherxm_data.csv
          git diff --quiet --cached || git commit -m "Update weather data"
          git push

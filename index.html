<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Acre Wood — Stanardsville, VA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #1B2430;
    --bg-deep: #141B24;
    --panel: #212B39;
    --panel-inset: #182029;
    --hairline: #34404F;
    --amber: #D4A24C;
    --amber-dim: #8C6F3C;
    --text: #EDE6D6;
    --text-dim: #93A1B5;
    --text-faint: #5D6B7E;
    --good: #6E9B6A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 48px 24px 96px; }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 28px;
    margin-bottom: 40px;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    margin: 0 0 8px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 5vw, 48px);
    margin: 0;
    line-height: 1.05;
  }

  .location-sub {
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text-dim);
    font-size: 13px;
    margin-top: 10px;
  }

  .status {
    text-align: right;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
  }

  .status .dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--good);
    margin-right: 6px;
    box-shadow: 0 0 8px var(--good);
  }

  .status .updated { color: var(--text-dim); margin-top: 4px; }

  .temp-secondary {
    font-size: 0.32em;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 10px;
    vertical-align: middle;
  }

  /* Instrument panel */
  .panel {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 36px 32px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 20px 40px -20px rgba(0,0,0,0.5);
  }

  .readout-main {
    display: flex;
    align-items: baseline;
    gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 28px;
  }

  .temp-big {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: clamp(64px, 10vw, 96px);
    color: var(--amber);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .temp-unit { font-size: 0.4em; color: var(--amber-dim); }

  .condition-block { font-family: 'Fraunces', serif; }
  .condition-block .cond { font-size: 22px; font-weight: 600; }
  .condition-block .feels { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-dim); margin-top: 4px; }

  .readout-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 24px;
  }

  .stat { }
  .stat .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .stat .value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
  }
  .stat .value .unit { font-size: 13px; color: var(--text-dim); margin-left: 3px; }

  /* Charts section */
  section.history { margin-top: 64px; }

  .section-head { margin-bottom: 28px; }
  .section-head h2 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    margin: 0 0 6px;
  }
  .section-head p {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
    margin: 0;
  }

  .chart-card {
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 6px;
    padding: 24px 20px;
    margin-bottom: 20px;
  }
  .chart-card h3 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 0 0 16px;
    font-weight: 500;
  }
  .chart-card canvas { max-height: 220px; }

  footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--hairline);
    font-family: 'IBM Plex Mono', monospace;
